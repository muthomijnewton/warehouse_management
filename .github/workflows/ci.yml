name: CI

on:
  push:
    branches: [develop, 'fix-*', 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_VERSION: v15.126.0
  BENCH_VERSION: 5.27.0
  CI: 'Yes'

jobs:
  tests:
    name: Frappe v15 integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      redis-cache:
        image: redis:7.2-alpine
        ports: ['13000:6379']
      redis-queue:
        image: redis:7.2-alpine
        ports: ['11000:6379']
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config
          npm install --global --force yarn@1.22.22
          python -m pip install frappe-bench==${BENCH_VERSION}
      - name: Initialize pinned Frappe
        run: |
          bench init --frappe-branch "$FRAPPE_VERSION" --skip-redis-config-generation --skip-assets --python "$(which python)" "$RUNNER_TEMP/frappe-bench"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
      - name: Install application and build assets
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          bench get-app warehouse_management "$GITHUB_WORKSPACE"
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin test.localhost
          bench --site test.localhost install-app warehouse_management
          bench --site test.localhost set-config allow_tests true
          bench build --app warehouse_management
          bench --site test.localhost migrate
      - name: Run application tests including concurrent withdrawals
        working-directory: ${{ runner.temp }}/frappe-bench
        run: bench --site test.localhost run-tests --app warehouse_management
        env:
          TYPE: server
      - name: Exercise legacy numeric migration
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          bench new-site --db-host 127.0.0.1 --db-root-password root --admin-password admin upgrade.localhost
          bench --site upgrade.localhost install-app warehouse_management
          bench --site upgrade.localhost execute warehouse_management.tests.upgrade_smoke.prepare
          bench --site upgrade.localhost migrate
          bench --site upgrade.localhost execute warehouse_management.tests.upgrade_smoke.verify
          bench --site upgrade.localhost migrate
          bench --site upgrade.localhost execute warehouse_management.tests.upgrade_smoke.verify
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-test-logs
          path: ${{ runner.temp }}/frappe-bench/logs/
          retention-days: 7
